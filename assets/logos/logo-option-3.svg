<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <!-- Dynamic Broadcast Digital Media Style -->
  <defs>
    <linearGradient id="opt3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <g transform="translate(10, 15)">
    <!-- Broadcast signal waves + Globe ring -->
    <circle cx="30" cy="30" r="28" fill="#18181B"/>
    <path d="M18 30 A12 12 0 0 1 42 30" fill="none" stroke="#FF334B" stroke-width="3" stroke-linecap="round"/>
    <path d="M13 30 A17 17 0 0 1 47 30" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="5" fill="#FFFFFF"/>
    <!-- Live dot badge -->
    <circle cx="48" cy="12" r="5" fill="#22C55E"/>
  </g>
  <text x="88" y="44" font-family="'Cabinet Grotesk', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#09090B" letter-spacing="-0.04em">NEWS<tspan fill="url(#opt3-grad)">TODAY</tspan></text>
  <!-- LIVE 24x7 pill -->
  <g transform="translate(88, 54)">
    <rect x="0" y="0" width="62" height="18" rx="4" fill="#FF334B"/>
    <text x="31" y="13" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">LIVE 24×7</text>
  </g>
  <text x="160" y="67" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#71717A" letter-spacing="0.08em">DIGITAL BROADCAST &amp; INVESTIGATIVE DESK</text>
</svg>
